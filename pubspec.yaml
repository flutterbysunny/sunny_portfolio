name: flutter_portfolio
description: A professional Flutter portfolio app showcasing projects, skills, and experience.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2
  visibility_detector: ^0.4.0+2


  # Scroll
  scrollable_positioned_list: ^0.3.8

  # URL Launcher
  url_launcher: ^6.2.6

  # Responsive
  responsive_framework: ^1.4.0

  # Icons
  font_awesome_flutter: ^10.7.0

  # Utils
  flutter_staggered_animations: ^1.1.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
